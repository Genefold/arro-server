name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint check
        run: uv run ruff check . --exclude tests

      - name: Ruff format check
        run: uv run ruff format --check . --exclude tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  publish:
    name: Publish Docker image (ghcr.io)
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/arro-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test pushed image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(grep ':sha-' <<<"$TAGS" | head -n1)"
          docker pull "$image"
          # Inherits the image HEALTHCHECK; only timing is overridden
          docker run -d --name smoke \
            --health-interval=3s \
            --health-start-period=5s \
            --health-retries=10 \
            -p 8000:8000 "$image"
          trap 'docker rm -f smoke' EXIT
          # Wait for Docker's own health state — no timing guesswork
          for i in $(seq 1 30); do
            hstatus="$(docker inspect --format='{{.State.Health.Status}}' smoke)"
            [ "$hstatus" = "healthy" ] && break
            [ "$hstatus" = "unhealthy" ] && { echo "Container unhealthy:"; docker logs smoke; exit 1; }
            sleep 2
          done
          # Single sanity hit against a known-healthy container
          curl --fail http://localhost:8000/api/health
